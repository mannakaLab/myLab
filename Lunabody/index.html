       /* ==========================================================================
          UI タブ切り替え & レンダリングエンジン
          ========================================================================== */
       let currentTab = 'home';

       function updateClock() {
           const now = new Date();
           const hours = String(now.getHours()).padStart(2, '0');
           const minutes = String(now.getMinutes()).padStart(2, '0');
           const clockEl = document.getElementById('current-time');
           if (clockEl) clockEl.textContent = `${hours}:${minutes}`;
       }
       setInterval(updateClock, 1000);
       updateClock();

       function switchTab(tabName) {
           currentTab = tabName;

           // ナビボタンのハイライト更新
           document.querySelectorAll('.nav-btn').forEach(btn => {
               btn.classList.remove('text-luna-sage', 'font-semibold');
               btn.classList.add('text-stone-400', 'font-normal');
           });
           const activeNav = document.getElementById(`nav-${tabName}`);
           if (activeNav) {
               activeNav.classList.remove('text-stone-400', 'font-normal');
               activeNav.classList.add('text-luna-sage', 'font-semibold');
           }

           const mainContent = document.getElementById('main-content');
           mainContent.innerHTML = '';
           mainContent.scrollTop = 0;

           switch (tabName) {
               case 'home':
                   renderHomeScreen(mainContent);
                   break;
               case 'workout':
                   renderWorkoutScreen(mainContent);
                   break;
               case 'meal':
                   renderMealScreen(mainContent);
                   break;
               case 'cycle':
                   renderCycleScreen(mainContent);
                   break;
               case 'progress':
                   renderProgressScreen(mainContent);
                   break;
               case 'settings':
                   renderSettingsScreen(mainContent);
                   break;
               default:
                   renderHomeScreen(mainContent);
           }
       }

       function formatSeconds(sec) {
           const m = Math.floor(sec / 60);
           const s = sec % 60;
           return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
       }

       function startTimer() {
           clearInterval(workoutTimerInterval);
           workoutTimerInterval = setInterval(() => {
               if (!activeWorkoutSession || activeWorkoutSession.isPaused) return;

               activeWorkoutSession.secondsRemaining--;
               const timerEl = document.getElementById('timer-display');
               if (timerEl) {
                   timerEl.textContent = formatSeconds(activeWorkoutSession.secondsRemaining);
               }

               if (activeWorkoutSession.secondsRemaining <= 0) {
                   clearInterval(workoutTimerInterval);
                   showToast('1種目が終了しました！');
                   nextWorkoutExercise();
               }
           }, 1000);
       }

       function toggleWorkoutPause() {
           if (!activeWorkoutSession) return;
           activeWorkoutSession.isPaused = !activeWorkoutSession.isPaused;
           const btn = document.getElementById('pause-btn');
           if (btn) {
               btn.innerHTML = activeWorkoutSession.isPaused ? '<i class="fas fa-play mr-1"></i> 再開' : '<i class="fas fa-pause mr-1"></i> 一時停止';
           }
       }

       function makeWorkoutLighter() {
           if (!activeWorkoutSession) return;
           activeWorkoutSession.secondsRemaining = Math.max(10, Math.floor(activeWorkoutSession.secondsRemaining / 2));
           showToast('運動時間を短縮（軽め設定）に調整しました');
       }

       function nextWorkoutExercise() {
           clearInterval(workoutTimerInterval);
           if (!activeWorkoutSession) return;

           if (activeWorkoutSession.currentIndex < activeWorkoutSession.exercises.length - 1) {
               activeWorkoutSession.currentIndex++;
               activeWorkoutSession.secondsRemaining = activeWorkoutSession.exercises[activeWorkoutSession.currentIndex].durationSec;
               renderActiveExerciseScreen();
           } else {
               // 完了画面へ
               completeWorkoutSession();
           }
       }

       function cancelWorkoutSession() {
           clearInterval(workoutTimerInterval);
           activeWorkoutSession = null;
           showToast('運動を中断しました');
           switchTab('workout');
       }

       function completeWorkoutSession() {
           clearInterval(workoutTimerInterval);
           const duration = activeWorkoutSession.courseKey === '3' ? 3 : (activeWorkoutSession.courseKey === '8' ? 8 : 15);

           // 履歴に保存
           const newLog = {
               id: Date.now().toString(),
               date: new Date().toISOString().split('T')[0],
               title: activeWorkoutSession.title,
               durationMinutes: duration,
               completed: true
           };

           saveState();

       function getCyclePhase(startDateStr, cycleLength = 28) {
           const start = new Date(startDateStr);
           const today = new Date();
           const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24)) % cycleLength;

           if (diffDays >= 0 && diffDays < 5) {
               return {
                   phaseName: '月経期（リセット期）',
                   adviceShort: '血行改善と温活。無理せずゆったりストレッチを。',
                   intensity: 'light'
               };
           } else if (diffDays >= 5 && diffDays < 13) {
               return {
                   phaseName: '卵胞期（キラキラ期）',
                   adviceShort: '代謝アップ！お尻＆体幹の筋トレ成果が出やすい時期。',
                   intensity: 'active'
               };
           } else if (diffDays >= 13 && diffDays < 17) {
               return {
                   phaseName: '排卵期',
                   adviceShort: '体調は良好。フォームの正確さを重視。',
                   intensity: 'normal'
               };
           } else {
               return {
                   phaseName: '黄体期（ご自愛期）',
                   adviceShort: 'むくみや食欲増に注意。温かい食事と3分〜8分ケアで十分。',
                   intensity: 'gentle'
               };
           }
       }

       function resetData() {
           if (confirm('すべてのデータ（記録・プロフィール）を初期化しますか？')) {
               localStorage.removeItem(APP_STORAGE_KEY);
               appData = defaultState;
               saveState();
               showToast('データを初期化しました');
               switchTab('home');
           }
       }

       /* ==========================================================================
          7. 専属コーチのメッセージ生成 ＆ 「喝を入れる」機能
          ========================================================================== */
       function getCoachAdvice(fatigueLevel, cyclePhase) {
           if (fatigueLevel === 'high') {
               return "今日は無理せず休む判断も立派な自己管理です。疲労を無視して追い込まず、身体を温めてリラックスしましょう。";
           }
           if (cyclePhase.intensity === 'gentle') {
               return "ご自愛期です。浮腫みや体調に合わせて3分や8分の軽めの運動で十分です。自分に優しくいきましょう。";
           }
           return "いいコンディションですね！今日はお尻と体幹に集中して、しなやかな姿勢と太極拳の美しさをつくっていきましょう。";
       }

       function triggerKatsu() {
           const modalTitle = document.getElementById('modal-title');
           const modalBody = document.getElementById('modal-body');

           modalTitle.textContent = '🔥 コーチからの熱い励まし';
           modalBody.innerHTML = `
               <div class="space-y-3 py-1">
                   <div class="p-3 bg-amber-50 rounded-xl border border-amber-200 text-stone-800 text-xs leading-relaxed font-semibold">
                       「理想の身体になりたいなら、考えているだけじゃ変わらないよ！完璧な15分を待たなくてもいい。まず3分、今すぐ身体を動かそう！」
                   </div>
                   <p class="text-[11px] text-stone-500">
                       小さな1歩を今日踏み出せるかどうかが、未来のシルエットを変えます。
                   </p>
                   <button onclick="closeModal(); startWorkoutProgram('3');" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 text-white font-bold text-xs rounded-xl shadow-md">
                       今すぐ3分コースを始める！
                   </button>
               </div>
           `;
           document.getElementById('modal').classList.remove('hidden');
       }

       /* UI ヘルパー */
       function showToast(msg) {
           const toast = document.getElementById('toast');
           const toastMsg = document.getElementById('toast-msg');
           if (toast && toastMsg) {
               toastMsg.textContent = msg;
               toast.classList.remove('hidden');
               setTimeout(() => {
                   toast.classList.add('hidden');
               }, 3000);
           }
       }

       function closeModal() {
           document.getElementById('modal').classList.add('hidden');
       }

       /* 画面読み込み時の初期化 */
       window.onload = function() {
           switchTab('home');
       };
   </script>
</body>
</html>
