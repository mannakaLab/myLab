<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>LUNA BODY - 「体重だけじゃない。鏡に映る私を変える。」</title>
   <!-- Tailwind CSS CDN -->
   <script src="https://cdn.tailwindcss.com"></script>
   <!-- FontAwesome Icons -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <!-- Chart.js CDN -->
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <!-- Google Fonts Inter & Noto Sans JP -->

   <script>
       tailwind.config = {
           theme: {
               extend: {
                   colors: {
                       luna: {
                           bg: '#FDFBF7',       // アイボリー背景
                           card: '#FFFFFF',     // 純白カード
                           beige: '#F5EFE6',    // ベージュサブカラー
                           sage: '#78938A',     // くすみグリーン (アクセント)
                           sageDark: '#566E66', // 濃いくすみグリーン
                           sageLight: '#E8EFEA',// 明るいくすみグリーン
                           text: '#333333',     // メインテキスト
                           subtext: '#767676',  // サブテキスト
                           accent: '#D4A373',   // ぬくもりのあるアクセントカラー
                       }
                   },
                   fontFamily: {
                       sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                   }
               }
           }
       }
   </script>
   <style>
       body {
           background-color: #FDFBF7;
           color: #333333;
           font-family: 'Noto Sans JP', sans-serif;
           -webkit-tap-highlight-color: transparent;
       }
       .fade-in {
           animation: fadeIn 0.25s ease-in-out;
       }
       @keyframes fadeIn {
           from { opacity: 0; transform: translateY(4px); }
           to { opacity: 1; transform: translateY(0); }
       }
   </style>
</head>
<body class="bg-luna-bg min-h-screen text-luna-text pb-20">

   <!-- ヘッダー -->
   <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200 px-4 py-3 shadow-xs">

           <div class="flex items-center space-x-2">
               <span class="text-xl">🌙</span>
               <h1 class="font-bold text-stone-800 text-base tracking-wide">LUNA BODY</h1>
           </div>
           <button onclick="triggerKatsu()" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold text-xs rounded-full border border-amber-300 shadow-xs transition flex items-center space-x-1">
               <span>🔥</span>
               <span>喝を入れる</span>
           </button>
       </div>
   </header>

   <!-- メインコンテンツ領域 -->
   <main id="main-content" class="max-w-md mx-auto px-4 py-4 space-y-4">
       <!-- JSでタブコンテンツが動的に描画されます -->
   </main>

   <!-- 下部固定ナビゲーションバー -->
   <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-stone-200 py-2 shadow-lg">
       <div class="max-w-md mx-auto flex justify-around items-center text-stone-500">
           <button id="nav-home" onclick="switchTab('home')" class="flex flex-col items-center space-y-0.5 w-1/5 py-1">
               <i class="fas fa-home text-lg"></i>
               <span class="text-[10px]">ホーム</span>
           </button>
           <button id="nav-workout" onclick="switchTab('workout')" class="flex flex-col items-center space-y-0.5 w-1/5 py-1">
               <i class="fas fa-dumbbell text-lg"></i>
               <span class="text-[10px]">運動</span>
           </button>
           <button id="nav-meal" onclick="switchTab('meal')" class="flex flex-col items-center space-y-0.5 w-1/5 py-1">
               <i class="fas fa-utensils text-lg"></i>
               <span class="text-[10px]">食事</span>
           </button>
           <button id="nav-cycle" onclick="switchTab('cycle')" class="flex flex-col items-center space-y-0.5 w-1/5 py-1">
               <i class="fas fa-calendar-alt text-lg"></i>
               <span class="text-[10px]">周期</span>
           </button>
           <button id="nav-progress" onclick="switchTab('progress')" class="flex flex-col items-center space-y-0.5 w-1/5 py-1">
               <i class="fas fa-chart-line text-lg"></i>
               <span class="text-[10px]">記録</span>
           </button>
       </div>
   </nav>

   <!-- モーダルダイアログ構造 -->
   <div id="modal" class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4 hidden">
       <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl fade-in max-h-[85vh] overflow-y-auto">
           <div class="flex justify-between items-center border-b pb-2">
               <h3 id="modal-title" class="font-bold text-stone-800 text-sm">タイトル</h3>
               <button onclick="closeModal()" class="text-stone-400 hover:text-stone-600 text-lg">&times;</button>
           </div>
           <div id="modal-body" class="space-y-3">
               <!-- 動的コンテンツ -->
           </div>
       </div>
   </div>

   <!-- トースト通知 -->
   <div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 bg-stone-800/90 text-white text-xs py-2 px-4 rounded-full shadow-lg hidden fade-in transition">
       <span id="toast-msg">メッセージ</span>
   </div>

   <!-- スクリプト定義 -->

               preferredTime: '8',
           },
           condition: {
               date: getTodayDateString(),
               fatigue: 'normal',
               appetite: 'normal',
               mood: 'good',
               stomach: 'good',
               easiness: 'normal',
               notes: ''

               lastPeriodStart: getTodayDateString(),
               cycleLength: 28,
               periodDuration: 5
           },
           workoutsLog: [],
           mealsLog: [],
           bodyLog: [],
           photos: [],

               'Tue': '横ももスッキリ＆室内エアウォーク（8分）',
               'Wed': '下半身代謝アップ＆ヒップ強化（8分）',
               'Thu': 'インドア完全燃焼フルケア（15分）',
               'Fri': '週末スッキリコンディショニング（8分）'
           }
       };

       let appData = loadState();
       let selectedMealDate = getTodayDateString();

       function getTodayDateString() {
           const today = new Date();
           const yyyy = today.getFullYear();
           const mm = String(today.getMonth() + 1).padStart(2, '0');
           const dd = String(today.getDate()).padStart(2, '0');
           return `${yyyy}-${mm}-${dd}`;
       }

       function loadState() {
           try {
               const saved = localStorage.getItem(APP_STORAGE_KEY);
               if (saved) {
                   const parsed = JSON.parse(saved);
                   if (!parsed.weeklySchedule) {
                       parsed.weeklySchedule = defaultState.weeklySchedule;
                   }
                   return parsed;
               }
           } catch (e) {
               console.error('Failed to load state from localStorage', e);
           }
           return defaultState;
       }

       function saveState() {
           try {
               localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(appData));
           } catch (e) {
               console.error('Failed to save state to localStorage', e);
           }
       }

       /* タブ切り替え処理 */
       function switchTab(tabName) {
           const tabs = ['home', 'workout', 'meal', 'cycle', 'progress'];
           tabs.forEach(t => {
               const btn = document.getElementById(`nav-${t}`);
               if (btn) {
                   if (t === tabName) {
                       btn.classList.add('text-luna-sageDark', 'font-bold');
                       btn.classList.remove('text-stone-500');
                   } else {
                       btn.classList.remove('text-luna-sageDark', 'font-bold');
                       btn.classList.add('text-stone-500');
                   }
               }
           });

           const container = document.getElementById('main-content');
           if (!container) return;

           if (tabName === 'home') renderHomeScreen(container);
           else if (tabName === 'workout') renderWorkoutScreen(container);
           else if (tabName === 'meal') renderMealScreen(container);
           else if (tabName === 'cycle') renderCycleScreen(container);
           else if (tabName === 'progress') renderProgressScreen(container);
       }

       /* ==========================================================================
          1. ホーム画面
          ========================================================================== */

                           <i class="fas fa-play text-xs"></i>

                               <span>周期・体調</span>
                               <i class="fas fa-arrow-right text-[10px]"></i>
                           </div>

                               <span class="text-pink-500">🌸</span>
                               <span>${cyclePhase.phaseName}</span>
                           </div>
                           <p class="text-[11px] text-stone-500 mt-1 line-clamp-1">${cyclePhase.adviceShort}</p>
                       </div>

                       <div onclick="switchTab('progress')" class="bg-white p-3 rounded-2xl border border-stone-100 shadow-sm hover:border-luna-sage transition cursor-pointer">

                               ${appData.bodyLog.length > 0 ? `W: ${appData.bodyLog[appData.bodyLog.length - 1].waist}cm / H: ${appData.bodyLog[appData.bodyLog.length - 1].hip}cm` : '未入力 (タップして登録)'}

                           </button>

                           </button>

       function formatSeconds(sec) {
           const m = Math.floor(sec / 60);
           const s = sec % 60;
           return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
       }

       function startTimer() {
           clearInterval(workoutTimerInterval);
           workoutTimerInterval = setInterval(() => {
               if (!activeWorkoutSession || activeWorkoutSession.isPaused) return;

               activeWorkoutSession.secondsRemaining--;
               const timerEl = document.getElementById('timer-display');
               if (timerEl) {
                   timerEl.textContent = formatSeconds(activeWorkoutSession.secondsRemaining);
               }

               if (activeWorkoutSession.secondsRemaining <= 0) {
                   clearInterval(workoutTimerInterval);
                   showToast('1種目が終了しました！');
                   nextWorkoutExercise();
               }
           }, 1000);
       }

       function toggleWorkoutPause() {
           if (!activeWorkoutSession) return;
           activeWorkoutSession.isPaused = !activeWorkoutSession.isPaused;
           const btn = document.getElementById('pause-btn');
           if (btn) {
               btn.innerHTML = activeWorkoutSession.isPaused ? '<i class="fas fa-play mr-1"></i> 再開' : '<i class="fas fa-pause mr-1"></i> 一時停止';
           }
       }

       function makeWorkoutLighter() {
           if (!activeWorkoutSession) return;
           activeWorkoutSession.secondsRemaining = Math.max(10, Math.floor(activeWorkoutSession.secondsRemaining / 2));
           showToast('運動時間を短縮しました');
       }

       function nextWorkoutExercise() {
           clearInterval(workoutTimerInterval);
           if (!activeWorkoutSession) return;

           if (activeWorkoutSession.currentIndex < activeWorkoutSession.exercises.length - 1) {
               activeWorkoutSession.currentIndex++;
               activeWorkoutSession.secondsRemaining = activeWorkoutSession.exercises[activeWorkoutSession.currentIndex].durationSec;
               renderActiveExerciseScreen();
           } else {
               completeWorkoutSession();
           }
       }

       function cancelWorkoutSession() {
           clearInterval(workoutTimerInterval);
           activeWorkoutSession = null;
           showToast('運動を中断しました');
           switchTab('workout');
       }

       function saveMealEntry() {

       /* ==========================================================================
          4. 生理周期 & 体調管理画面
          ========================================================================== */
       function getCyclePhase(startDateStr, cycleLength = 28) {
           const start = new Date(startDateStr);
           const today = new Date();
           const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24)) % cycleLength;

           if (diffDays >= 0 && diffDays < 5) {
               return { phaseName: '月経期（リセット期）', adviceShort: '血行改善と温活。無理せずゆったりストレッチを。', intensity: 'light' };
           } else if (diffDays >= 5 && diffDays < 13) {
               return { phaseName: '卵胞期（キラキラ期）', adviceShort: '代謝アップ！お尻＆体幹の筋トレ成果が出やすい時期。', intensity: 'active' };
           } else if (diffDays >= 13 && diffDays < 17) {
               return { phaseName: '排卵期', adviceShort: '体調は良好。フォームの正確さを重視。', intensity: 'normal' };
           } else {
               return { phaseName: '黄体期（ご自愛期）', adviceShort: 'むくみや張りに注意。温かい食事と室内ストレッチで優しく。', intensity: 'gentle' };
           }
       }

       function initProgressChart() {
           const ctx = document.getElementById('progressChart');
           if (!ctx) return;
           const labels = appData.bodyLog.map(item => item.date);
           const weights = appData.bodyLog.map(item => item.weight);
           const hips = appData.bodyLog.map(item => item.hip);

           new Chart(ctx, {
               type: 'line',
               data: {
                   labels: labels,
                   datasets: [
                       { label: '体重(kg)', data: weights, borderColor: '#D4A373', backgroundColor: 'rgba(212, 163, 115, 0.1)', borderWidth: 2, tension: 0.3 },
                       { label: 'ヒップ(cm)', data: hips, borderColor: '#78938A', backgroundColor: 'rgba(120, 147, 138, 0.1)', borderWidth: 2, tension: 0.3 }
                   ]
               },
               options: {
                   responsive: true,
                   maintainAspectRatio: false,
                   plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } },
                   scales: { y: { beginAtZero: false, grid: { color: '#F3F4F6' } }, x: { grid: { display: false } } }
               }
           });
       }
