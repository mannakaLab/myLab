       function getTodayDateString() {
           const today = new Date();
           const yyyy = today.getFullYear();
           const mm = String(today.getMonth() + 1).padStart(2, '0');
           const dd = String(today.getDate()).padStart(2, '0');
           return `${yyyy}-${mm}-${dd}`;
       }

       function loadState() {
           try {
               const saved = localStorage.getItem(APP_STORAGE_KEY);
               if (saved) {
                   const parsed = JSON.parse(saved);
                   // 既存データを保持しつつ、不足している新プロパティを安全に補完
                   return {
                       ...defaultState,
                       ...parsed,
                       profile: { ...defaultState.profile, ...(parsed.profile || {}) },
                       condition: { ...defaultState.condition, ...(parsed.condition || {}) },
                       cycle: { ...defaultState.cycle, ...(parsed.cycle || {}) },
                       workoutsLog: parsed.workoutsLog || [],
                       mealsLog: parsed.mealsLog || [],
                       bodyLog: parsed.bodyLog || [],
                       thighLog: parsed.thighLog || [],
                       photos: parsed.photos || [],
                       weeklySchedule: defaultState.weeklySchedule
                   };
               }
           } catch (e) {
               console.error('Failed to load state from localStorage', e);
           }
           return defaultState;
       }

       function saveState() {
           try {
               localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(appData));
           } catch (e) {

       }

       /* 体調＆月経周期を考慮した運動調整アドバイス取得 */
       function getAdjustedWorkoutGuidance() {
           const fatigue = appData.condition.fatigue; // 'low'=元気満タン, 'normal'=少し疲れた, 'high'=やる気ゼロ・疲労が強い
           const cyclePhase = getCyclePhase(appData.cycle.lastPeriodStart, appData.cycle.cycleLength);
           const isGentleCycle = (cyclePhase.phaseKey === 'period' || cyclePhase.phaseKey === 'before_period');

           if (fatigue === 'high') {
               return {
                   statusLabel: 'やる気ゼロ・疲労が強い',
                   badgeColor: 'bg-rose-100 text-rose-800',
                   recommendedSets: 0,
                   shouldRest: true,
                   title: '今日は「休息」を最優先にしましょう 🌿',
                   message: '疲労が強い日ややる気が出ない日は、無理に運動しないことが一番のボディメイクです。今日まで頑張ってきたご自身をたっぷり労わってあげてくださいね。深呼吸するだけでも100点満点です！'
               };
           } else if (fatigue === 'normal' || isGentleCycle) {
               const cycleNote = isGentleCycle ? `（※現在「${cyclePhase.phaseName}」のため、お身体に優しいペースに自動調整しています）` : '';
               return {
                   statusLabel: fatigue === 'normal' ? '少し疲れた' : '周期ご自愛モード',
                   badgeColor: 'bg-amber-100 text-amber-800',
                   recommendedSets: 1,
                   shouldRest: false,
                   title: '1セットのみ・ゆっくり丁寧に行いましょう 🍃',
                   message: `今日は基本の【1セット】で十分です！反動を使わずゆっくりとした動作を意識し、つらければ種目数を1〜2つに減らしても大丈夫です。${cycleNote}`
               };
           } else {
               return {
                   statusLabel: '元気満タン',
                   badgeColor: 'bg-emerald-100 text-emerald-800',
                   recommendedSets: 1,
                   canDoTwoSets: true,
                   shouldRest: false,
                   title: '全メニュー実施OK！余裕があれば2セットまで ✨',
                   message: '体調バッチリですね！まずは基本の1セットを丁寧に行い、慣れてきて余裕があれば最大2セットまでチャレンジできます（初心者は1セットからが安心です）。'
               };
           }

       /* タブ切り替え処理 */

           const tabs = ['home', 'workout', 'meal', 'cycle', 'progress'];
           tabs.forEach(t => {
               const btn = document.getElementById(`nav-${t}`);
               if (btn) {
                   if (t === tabName) {
                       btn.classList.add('text-luna-sageDark', 'font-bold');
                       btn.classList.remove('text-stone-500');
                   } else {
                       btn.classList.remove('text-luna-sageDark', 'font-bold');
                       btn.classList.add('text-stone-500');
                   }
               }
           });

           const container = document.getElementById('main-content');
           if (!container) return;

           if (tabName === 'home') renderHomeScreen(container);
           else if (tabName === 'workout') renderWorkoutScreen(container);
           else if (tabName === 'meal') renderMealScreen(container);
           else if (tabName === 'cycle') renderCycleScreen(container);
           else if (tabName === 'progress') renderProgressScreen(container);
       }

                       <p class="text-xs text-stone-500 leading-relaxed">${INNER_THIGH_PROGRAMS.thu.desc}</p>

                           <li>股関節や鼠径部に痛みや違和感が出たら、すぐに運動を中止してください。</li>
                           <li>無理な開脚や強いストレッチは行わず、正しいフォームを最優先にします。</li>

       }

       /* ==========================================================================
          運動セッション実行画面（大きな表示・回数カウンター・5秒カウントダウン・完了チェック）
          ========================================================================== */
       let sessionState = null;
       let elapsedInterval = null;
       let holdCountdownInterval = null;

       function clearAllWorkoutTimers() {
           if (elapsedInterval) clearInterval(elapsedInterval);
           if (holdCountdownInterval) clearInterval(holdCountdownInterval);
           elapsedInterval = null;
           holdCountdownInterval = null;
       }

       function startInnerThighSession(programKey) {
           const program = INNER_THIGH_PROGRAMS[programKey];
           if (!program) return;

           const guidance = getAdjustedWorkoutGuidance();

           // 疲労が強い場合は確認モーダルを挟む（強制はせず休息を提案）
           if (guidance.shouldRest) {
               showFatigueRestConfirmModal(programKey);
               return;
           }

           initSessionState(program, 1);
       }

       function showFatigueRestConfirmModal(programKey) {
           const modalTitle = document.getElementById('modal-title');
           const modalBody = document.getElementById('modal-body');

           modalTitle.textContent = '🌿 今日は休息を優先しませんか？';
           modalBody.innerHTML = `
               <div class="space-y-3 text-xs text-stone-700">
                   <p class="leading-relaxed">
                       現在「やる気ゼロ・疲労が強い」が選択されています。疲れが溜まっている時は、無理に運動するよりも<strong>しっかり休むこと</strong>がボディメイクの近道です。
                   </p>
                   <button onclick="closeModal(); recordRestDayCompleted();" class="w-full py-3 bg-luna-sage text-white font-bold rounded-xl shadow">
                       今日は休息日にする（達成記録をつける）
                   </button>
                   <button onclick="closeModal(); initSessionState(INNER_THIGH_PROGRAMS['${programKey}'], 1);" class="w-full py-2.5 bg-stone-100 text-stone-600 font-bold rounded-xl">
                       それでも軽めに1セットだけやってみる
                   </button>
               </div>
           `;
           document.getElementById('modal').classList.remove('hidden');
       }

       function initSessionState(program, targetSets = 1) {
           clearAllWorkoutTimers();
           sessionState = {
               programKey: program.id,
               title: program.title,
               exercises: program.exercises,
               currentIndex: 0,
               currentSet: 1,
               targetSets: targetSets,
               completedChecks: program.exercises.map(() => false),
               elapsedSeconds: 0,
               holdRemaining: 0,
               isHoldRunning: false
           };

           elapsedInterval = setInterval(() => {
               if (!sessionState) return;
               sessionState.elapsedSeconds++;
               const el = document.getElementById('session-elapsed-time');
               if (el) el.textContent = formatSeconds(sessionState.elapsedSeconds);
           }, 1000);

           renderSessionExecutionScreen();
       }

       function renderSessionExecutionScreen() {
           if (!sessionState) return;
           const container = document.getElementById('main-content');
           const ex = sessionState.exercises[sessionState.currentIndex];
           const isChecked = sessionState.completedChecks[sessionState.currentIndex];

           container.innerHTML = `
               <div class="space-y-4 fade-in">
                   <!-- 上部進捗バー -->
                   <div class="flex justify-between items-center text-xs font-bold text-stone-600">
                       <span class="truncate pr-2">${sessionState.title}（${sessionState.currentSet}セット目）</span>
                       <span class="shrink-0 bg-luna-sageLight text-luna-sageDark px-2 py-0.5 rounded-full">
                           経過: <span id="session-elapsed-time">${formatSeconds(sessionState.elapsedSeconds)}</span>
                       </span>
                   </div>

                   <!-- 種目ステップ表示（タップで移動可能） -->
                   <div class="grid grid-cols-${sessionState.exercises.length} gap-1.5">
                       ${sessionState.exercises.map((item, idx) => `
                           <button onclick="jumpToExercise(${idx})" class="py-1.5 px-1 rounded-lg text-[10px] font-bold border transition truncate ${idx === sessionState.currentIndex ? 'bg-luna-sage text-white border-luna-sage' : (sessionState.completedChecks[idx] ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-white text-stone-400 border-stone-200')}">
                               ${sessionState.completedChecks[idx] ? '✓ ' : ''}${idx + 1}種目目
                           </button>
                       `).join('')}
                   </div>

                   <!-- メイン運動カード（スマホで見やすい大きな表示） -->
                   <div class="bg-white p-5 rounded-3xl border border-stone-200 shadow-md space-y-4">
                       <div class="text-center space-y-1.5">
                           <span class="inline-block px-3 py-1 bg-luna-pastelPink text-pink-900 text-xs font-bold rounded-full">
                               鍛える部位：${ex.target}
                           </span>
                           <h2 class="text-xl font-extrabold text-stone-800 pt-1">${ex.name}</h2>
                           <div class="text-2xl font-extrabold text-luna-sageDark tracking-wide">
                               目安：${ex.repsText}
                           </div>
                       </div>

                       <!-- 正しい姿勢のイラスト -->
                       <div class="py-1">
                           ${ex.svg}
                       </div>

                       ${ex.hasHoldTimer ? `
                           <!-- 5秒キープ用カウントダウン -->
                           <div class="bg-luna-bg p-4 rounded-2xl border border-stone-200/80 text-center space-y-2">
                               <div class="text-xs font-bold text-stone-600">5秒キープ カウントダウン</div>
                               <div id="hold-timer-display" class="text-4xl font-extrabold ${sessionState.isHoldRunning ? 'text-pink-600 pulse-soft' : 'text-stone-800'}">
                                   ${sessionState.isHoldRunning ? sessionState.holdRemaining + ' 秒' : '5 秒'}
                               </div>
                               <button onclick="startFiveSecondHold()" class="w-full py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold text-sm rounded-xl shadow transition">
                                   <i class="fas fa-stopwatch mr-1"></i> ${sessionState.isHoldRunning ? 'カウント中...' : '5秒キープをスタート'}
                               </button>
                           </div>
                       ` : ''}

                       <!-- 完了チェックボタン -->
                       <button onclick="toggleExerciseCompletedCheck()" class="w-full py-4 rounded-2xl font-bold text-base border-2 transition flex items-center justify-center space-x-2 shadow-xs active:scale-[0.99] ${isChecked ? 'bg-emerald-500 border-emerald-500 text-white shadow' : 'bg-luna-sageLight/40 border-luna-sage text-luna-sageDark hover:bg-luna-sageLight'}">
                           <i class="fas ${isChecked ? 'fa-check-circle' : 'fa-circle'} text-lg"></i>
                           <span>${isChecked ? '完了しました！✓' : '完了したら押す'}</span>
                       </button>
                   </div>

                   <!-- 分かりやすい日本語の説明＆注意点 -->
                   <div class="bg-white p-4 rounded-2xl border border-stone-200/80 shadow-sm space-y-2.5 text-xs">
                       <div class="font-bold text-stone-800 border-b pb-1.5 flex items-center space-x-1.5">
                           <i class="fas fa-info-circle text-luna-sage"></i>
                           <span>やり方と意識するポイント</span>
                       </div>
                       <p class="text-stone-700 leading-relaxed"><strong>手順：</strong>${ex.explanation}</p>
                       <p class="text-luna-sageDark leading-relaxed"><strong>コツ：</strong>${ex.points}</p>
                       <div class="p-2.5 bg-rose-50 rounded-xl border border-rose-100 text-rose-800 leading-relaxed">
                           <strong>⚠️ 注意点：</strong>${ex.cautions}
                       </div>
                   </div>

                   <!-- 下部ナビゲーションボタン（大きく押しやすく） -->
                   <div class="flex gap-2 pt-1">
                       <button onclick="cancelInnerThighSession()" class="px-4 py-3.5 bg-stone-200 text-stone-700 font-bold text-xs rounded-xl">
                           中断する
                       </button>
                       ${sessionState.currentIndex < sessionState.exercises.length - 1 ? `
                           <button onclick="goToNextExercise()" class="flex-1 py-3.5 bg-luna-sage text-white font-bold text-sm rounded-xl shadow-md">
                               次の種目へ進む ➔
                           </button>
                       ` : `
                           <button onclick="finishInnerThighSession()" class="flex-1 py-3.5 bg-gradient-to-r from-luna-sage to-luna-sageDark text-white font-bold text-sm rounded-xl shadow-md">
                               🎉 トレーニングを完了する
                           </button>
                       `}
                   </div>
               </div>
           `;
       }

       function jumpToExercise(index) {
           if (!sessionState) return;
           if (holdCountdownInterval) clearInterval(holdCountdownInterval);
           sessionState.isHoldRunning = false;
           sessionState.currentIndex = index;
           renderSessionExecutionScreen();
       }

       function startFiveSecondHold() {
           if (!sessionState || sessionState.isHoldRunning) return;
           sessionState.isHoldRunning = true;
           sessionState.holdRemaining = 5;
           renderSessionExecutionScreen();

           holdCountdownInterval = setInterval(() => {
               if (!sessionState) {
                   clearInterval(holdCountdownInterval);
                   return;
               }
               sessionState.holdRemaining--;
               const displayEl = document.getElementById('hold-timer-display');
               if (displayEl) {
                   displayEl.textContent = sessionState.holdRemaining > 0 ? `${sessionState.holdRemaining} 秒` : 'OK！';
               }

               if (sessionState.holdRemaining <= 0) {
                   clearInterval(holdCountdownInterval);
                   sessionState.isHoldRunning = false;
                   showToast('5秒キープ完了！おつかれさまです✨');
                   renderSessionExecutionScreen();
               }
           }, 1000);
       }

       function toggleExerciseCompletedCheck() {
           if (!sessionState) return;
           const idx = sessionState.currentIndex;
           sessionState.completedChecks[idx] = true;

           if (idx < sessionState.exercises.length - 1) {
               showToast('完了！次の種目へ進みます✨');
               goToNextExercise();
           } else {
               finishInnerThighSession();
           }
       }

       function goToNextExercise() {
           if (!sessionState) return;
           if (holdCountdownInterval) clearInterval(holdCountdownInterval);
           sessionState.isHoldRunning = false;
           sessionState.completedChecks[sessionState.currentIndex] = true;
           sessionState.currentIndex++;
           renderSessionExecutionScreen();
       }

       function cancelInnerThighSession() {
           clearAllWorkoutTimers();
           sessionState = null;
           showToast('運動を中断しました。無理せず自分のペースで大丈夫です🌷');
           switchTab('workout');
       }

       function finishInnerThighSession() {
           if (!sessionState) return;
           clearAllWorkoutTimers();

           // 未チェックの最終種目も完了に
           sessionState.completedChecks[sessionState.currentIndex] = true;

           const durationMin = Math.max(1, Math.round(sessionState.elapsedSeconds / 60)) || 10;
           const totalRepsDone = sessionState.exercises.reduce((sum, ex, i) => {
               return sum + (sessionState.completedChecks[i] ? ex.totalReps : 0);
           }, 0);

           const completedProgramKey = sessionState.programKey;
           const completedTitle = sessionState.title;
           const currentSetNum = sessionState.currentSet;
           const guidance = getAdjustedWorkoutGuidance();

           // 運動ログに保存
           appData.workoutsLog.push({
               id: Date.now().toString(),
               date: getTodayDateString(),
               programKey: completedProgramKey,
               title: `${completedTitle}（${currentSetNum}セット目）`,
               durationMinutes: durationMin,
               totalReps: totalRepsDone,
               fatigue: appData.condition.fatigue,
               completed: true
           });
           saveState();

           sessionState = null;

           const mainContent = document.getElementById('main-content');
           mainContent.innerHTML = `
               <div class="space-y-5 py-4 text-center fade-in">
                   <div class="w-20 h-20 mx-auto rounded-full bg-luna-pastelPink text-pink-600 flex items-center justify-center text-4xl shadow-md">
                       🌸
                   </div>
                   <div class="space-y-1">
                       <h2 class="text-xl font-extrabold text-stone-800">お疲れ様でした！達成です✨</h2>
                       <p class="text-xs text-stone-500">${completedTitle}（${currentSetNum}セット目）を記録しました。</p>
                   </div>

                   <div class="grid grid-cols-2 gap-3 text-center">
                       <div class="bg-white p-3 rounded-2xl border border-stone-200/80 shadow-xs">
                           <span class="text-[10px] text-stone-400 block">今回の運動時間</span>
                           <span class="text-lg font-extrabold text-luna-sageDark">${durationMin} 分</span>
                       </div>
                       <div class="bg-white p-3 rounded-2xl border border-stone-200/80 shadow-xs">
                           <span class="text-[10px] text-stone-400 block">合計実施回数</span>
                           <span class="text-lg font-extrabold text-pink-600">${totalRepsDone} 回</span>
                       </div>
                   </div>

                   <div class="bg-white p-4 rounded-2xl border border-stone-200/80 shadow-sm text-left text-xs space-y-2">
                       <div class="font-bold text-stone-800 border-b pb-1">専属コーチからのメッセージ</div>
                       <p class="text-stone-700 leading-relaxed">
                           「素晴らしいフォームと集中力でした！内腿とお尻の筋肉にしっかり刺激が入っています。体重の数値だけでなく、こうして丁寧にお身体を動かした積み重ねが、必ずしなやかな美脚ラインにつながりますよ。」
                       </p>
                   </div>

                   ${guidance.canDoTwoSets && currentSetNum < 2 ? `
                       <button onclick="initSessionState(INNER_THIGH_PROGRAMS['${completedProgramKey}'], 2)" class="w-full py-3 bg-luna-pastelMint hover:bg-emerald-100 text-luna-sageDark font-bold text-xs rounded-xl border border-luna-sage/30 transition">
                           ✨ 元気満タンなので「2セット目」に挑戦する
                       </button>
                   ` : ''}

                   <button onclick="switchTab('progress')" class="w-full py-3 bg-white border border-stone-200 text-stone-700 font-bold text-xs rounded-xl">
                       📊 達成率・成長記録を見る
                   </button>

                   <button onclick="switchTab('home')" class="w-full py-3.5 bg-luna-sage text-white font-bold text-sm rounded-xl shadow-md">
                       ホームに戻る
                   </button>
               </div>
           `;
       }

       function formatSeconds(sec) {
           const m = Math.floor(sec / 60);
           const s = sec % 60;
           return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
       }

       /* ==========================================================================
          3. 食事管理画面（既存機能・デザインを完全維持）
          ========================================================================== */
       function getCycleNutritionTarget() {
           const cyclePhase = getCyclePhase(appData.cycle.lastPeriodStart, appData.cycle.cycleLength);
           if (cyclePhase.phaseKey === 'period') {
               return { phase: '① 生理中（1〜5日目）', kcalText: '1,300〜1,400 kcal', minKcal: 1300, maxKcal: 1400, pText: '75〜85g', minP: 75, maxP: 85 };
           } else if (cyclePhase.phaseKey === 'after_period') {
               return { phase: '② 生理後〜排卵前', kcalText: '1,300〜1,350 kcal', minKcal: 1300, maxKcal: 1350, pText: '75〜85g', minP: 75, maxP: 85 };
           } else if (cyclePhase.phaseKey === 'ovulation') {
               return { phase: '③ 排卵前後', kcalText: '1,300〜1,350 kcal', minKcal: 1300, maxKcal: 1350, pText: '75〜85g', minP: 75, maxP: 85 };
           } else {
               return { phase: '④ 排卵後〜生理前', kcalText: '1,350〜1,450 kcal', minKcal: 1350, maxKcal: 1450, pText: '75〜85g', minP: 75, maxP: 85 };
           }
       }

                           <input type="date" value="${selectedMealDate}" onchange="changeMealDate(this.value)" class="border border-stone-200 rounded-lg px-2 py-1 text-xs text-stone-700 bg-stone-50 focus:outline-none focus:border-luna-sage">
                           ${!isToday ? `<button onclick="changeMealDate('${todayStr}')" class="px-2 py-1 bg-luna-sageLight text-luna-sageDark font-bold text-[10px] rounded-lg">今日に戻る</button>` : ''}

                   <div class="bg-white p-4 rounded-2xl border border-stone-200/70 shadow-sm space-y-3">
                       <div class="flex justify-between items-center text-xs">
                           <span class="font-bold text-stone-700 flex items-center">

                       <div class="grid grid-cols-2 gap-3 text-center">

           const dateInput = document.getElementById('meal-date-input').value;

           const kcal = parseInt(document.getElementById('meal-kcal').value) || 0;

               const mealIndex = appData.mealsLog.findIndex(m => m.id === mealId);

                   appData.mealsLog[mealIndex] = {
                       ...appData.mealsLog[mealIndex],

                       type: type,
                       text: text,
                       kcal: kcal,

       function getCyclePhase(startDateStr, cycleLength = 28) {
           if (appData.cycle.manualPhase) {
               switch (appData.cycle.manualPhase) {
                   case 'period':
                       return { phaseKey: 'period', phaseName: '月経期（生理中）', adviceShort: '血行改善と温活。無理せず1セット・ゆっくりペースで。', intensity: 'light' };
                   case 'after_period':
                       return { phaseKey: 'after_period', phaseName: '卵胞期（生理後〜排卵前）', adviceShort: '代謝アップ！内腿＆お尻の筋トレ成果が出やすい時期。', intensity: 'active' };
                   case 'ovulation':
                       return { phaseKey: 'ovulation', phaseName: '排卵前後', adviceShort: '体調は良好。丁寧なフォームを意識して美脚づくり。', intensity: 'normal' };
                   case 'before_period':
                       return { phaseKey: 'before_period', phaseName: '黄体期（生理前・ご自愛期）', adviceShort: 'むくみやすい時期。休息を優先しつつ優しくケアを。', intensity: 'gentle' };
               }
           }

           if (!startDateStr) {
               return { phaseKey: 'period', phaseName: '月経期（生理中）', adviceShort: '血行改善と温活。無理せず1セット・ゆっくりペースで。', intensity: 'light' };
           }

           const [sYear, sMonth, sDay] = startDateStr.split('-').map(Number);
           const start = new Date(sYear, sMonth - 1, sDay);
           const todayObj = new Date();
           const today = new Date(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());

           const diffTime = today - start;
           let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
           diffDays = ((diffDays % cycleLength) + cycleLength) % cycleLength;

           if (diffDays >= 0 && diffDays < 5) {
               return { phaseKey: 'period', phaseName: '月経期（生理中）', adviceShort: '血行改善と温活。無理せず1セット・ゆっくりペースで。', intensity: 'light' };
           } else if (diffDays >= 5 && diffDays < 13) {
               return { phaseKey: 'after_period', phaseName: '卵胞期（生理後〜排卵前）', adviceShort: '代謝アップ！内腿＆お尻の筋トレ成果が出やすい時期。', intensity: 'active' };
           } else if (diffDays >= 13 && diffDays < 17) {
               return { phaseKey: 'ovulation', phaseName: '排卵前後', adviceShort: '体調は良好。丁寧なフォームを意識して美脚づくり。', intensity: 'normal' };
           } else {
               return { phaseKey: 'before_period', phaseName: '黄体期（生理前・ご自愛期）', adviceShort: 'むくみやすい時期。休息を優先しつつ優しくケアを。', intensity: 'gentle' };
           }
       }

       function calculateWeeklyAchievementStats() {
           // 過去4週間（今週を含む）の週ごとの達成率を計算（目標：週3回＝月・水・木）
           const weeks = [];
           const now = new Date();
           // 今週の月曜日を基準にする
           const dayOfWeek = now.getDay();
           const diffToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
           const currentMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);

           for (let w = 3; w >= 0; w--) {
               const weekStart = new Date(currentMonday);
               weekStart.setDate(currentMonday.getDate() - w * 7);
               const weekEnd = new Date(weekStart);
               weekEnd.setDate(weekStart.getDate() + 6);

               const startStr = `${weekStart.getFullYear()}-${String(weekStart.getMonth() + 1).padStart(2, '0')}-${String(weekStart.getDate()).padStart(2, '0')}`;
               const endStr = `${weekEnd.getFullYear()}-${String(weekEnd.getMonth() + 1).padStart(2, '0')}-${String(weekEnd.getDate()).padStart(2, '0')}`;

               // その週に実施したユニークな運動日数（休息記録も自己管理としてカウント可能）
               const logsInWeek = appData.workoutsLog.filter(l => l.date >= startStr && l.date <= endStr);
               const uniqueDays = new Set(logsInWeek.map(l => l.date)).size;
               // 週間目標は3回（月・水・木）を100%として算出
               const rate = Math.min(100, Math.round((uniqueDays / 3) * 100));

               weeks.push({
                   label: w === 0 ? '今週' : `${w}週前`,
                   count: uniqueDays,
                   rate: rate
               });
           }
           return weeks;
       }

       function initWeeklyAchievementChart(weeklyStats) {

                       borderRadius: 8,
                       barThickness: 28
                   }]
               },
               options: {
                   responsive: true,
                   maintainAspectRatio: false,
                   plugins: { legend: { display: false } },
                   scales: {
                       y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%', font: { size: 10 } }, grid: { color: '#F3F4F6' } },
                       x: { grid: { display: false }, ticks: { font: { size: 11 } } }
                   }
               }
           });
       }

       function initProgressChart() {
           const ctx = document.getElementById('progressChart');
           if (!ctx) return;
           if (progressChartInstance) {
               progressChartInstance.destroy();
           }

           const sortedLogs = [...appData.bodyLog].sort((a, b) => a.date.localeCompare(b.date));

           const waists = sortedLogs.map(item => (item.waist && item.waist > 0) ? item.waist : null);
           const hips = sortedLogs.map(item => (item.hip && item.hip > 0) ? item.hip : null);

           progressChartInstance = new Chart(ctx, {
               type: 'line',
               data: {
                   labels: labels,
                   datasets: [
                       { label: '体重(kg)', data: weights, borderColor: '#D4A373', backgroundColor: 'rgba(212, 163, 115, 0.15)', borderWidth: 2.5, pointRadius: 4, spanGaps: true, tension: 0.3 },

                   ]

                   responsive: true,
                   maintainAspectRatio: false,
                   plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } },
                   scales: {
                       y: { beginAtZero: false, grid: { color: '#F3F4F6' }, ticks: { font: { size: 10 } } },

                   }

           if (root > 0 || mid > 0 || aboveKnee > 0 || appearanceNote) {
               appData.thighLog.push({

                   appearanceNote

           if (weight > 0 || waist > 0 || hip > 0) {

               if (hip > 0) appData.profile.currentHip = hip;
               appData.bodyLog.push({ date: dateVal, weight, waist, hip, postureScore: 4, taichiEase: '記録' });
